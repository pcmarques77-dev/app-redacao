# Contingência: atualiza snapshots do Radar de Pautas (RSS + Trends SEO) no Supabase.
#
# Fonte principal: crontab horário no servidor (ver docs/radar-snapshots.md e
# scripts/linux/). Este workflow é para indisponibilidade temporária do servidor.
# Dispare manualmente em Actions → Run workflow. Não use como rotina diária.
#
# Secrets em Settings → Secrets and variables → Actions:
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY

name: Radar RSS snapshots

on:
  workflow_dispatch:
  # Contingência prolongada (servidor fora do ar): descomente e ajuste o horário.
  # schedule:
  #   - cron: "0 * * * *"

concurrency:
  group: ronda-rss-snapshot
  cancel-in-progress: true

jobs:
  push-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Push RSS snapshots to Supabase
        run: npm run ronda:push-snapshot
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Push Trends SEO snapshot to Supabase
        run: npm run trends:push-snapshot
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
