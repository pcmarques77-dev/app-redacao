# Atualiza snapshots RSS do Radar de Pautas no Supabase.
# Necessário para Ronda INSS e Longevidade (Google Notícias bloqueia a Vercel).
#
# Secrets em Settings → Secrets and variables → Actions:
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY

name: Radar RSS snapshots

on:
  schedule:
    # 07:00, 13:00 e 19:00 em Brasília (UTC-3)
    - cron: "0 10,16,22 * * *"
  workflow_dispatch:

concurrency:
  group: ronda-rss-snapshot
  cancel-in-progress: true

jobs:
  push-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Push RSS snapshots to Supabase
        run: npm run ronda:push-snapshot
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
